<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador y Evaluador de Contraseñas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="background-glow"></div>
    <div class="app-container">
      <div class="pass-card">
        <div class="card-header">
          <div class="badge">Seguridad Web</div>
          <h1>Generador de contraseñas</h1>
          <p>Crea contraseñas robustas y analiza su nivel de protección</p>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="input-box">
            <input type="password" id="password" placeholder="Escribe tu contraseña..." autocomplete="off" />
            <button type="button" id="toggle-btn">Mostrar</button>
          </div>
        </div>

        <div class="strength-container">
          <div class="bar-container">
            <div id="progress-bar"></div>
          </div>
          <div class="strength-info">
            <span>Nivel de seguridad</span>
            <span id="security-level">Sin evaluar</span>
          </div>
        </div>

        <button type="button" id="generate-btn" class="btn-primary">Generar contraseña segura</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
